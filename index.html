<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SISTEM MANAJEMEN SANTRI (SMS)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f6b3d;
            --primary-light: #e6f4ec;
            --accent: #c7a43b;
            --bg: #f8faf9;
            --surface: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.02);
            --radius: 18px;
            --sidebar-width: 260px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Login screen tetap */
        #auth-screen { 
            height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: radial-gradient(circle at 15% 25%, #0a4b2a 0%, transparent 50%),
                        radial-gradient(circle at 85% 85%, #0f6b3d 0%, transparent 50%),
                        #051f12; 
        }
        .login-box-new { 
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 28px; 
            box-shadow: 0 30px 50px rgba(0,0,0,0.3); width: 90%; max-width: 420px; margin: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .login-header h2 { color: var(--primary); font-weight: 700; }
        .btn-login-new { background: var(--primary); border-radius: 12px; font-weight: 600; letter-spacing: 0.5px; }
        .btn-login-new:hover { background: #09512e; }

        /* Sidebar */
        #app-screen { display: none; height: 100vh; overflow: hidden; }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--primary);
            color: white;
            display: flex; flex-direction: column;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10; flex-shrink: 0;
            box-shadow: 2px 0 15px rgba(0,0,0,0.08);
        }
        .sidebar.collapsed { width: 85px; }
        .sidebar-header { height: 80px; display: flex; align-items: center; padding-left: 25px; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo-icon { font-size: 26px; color: var(--accent); }
        .sidebar-header h3 { font-size: 15px; line-height: 1.3; font-weight: 700; }
        .nav-menu { flex: 1; padding: 20px 0 20px 15px; }
        .nav-item { padding: 14px 20px; cursor: pointer; display: flex; align-items: center; gap: 14px; border-radius: 30px 0 0 30px; margin-bottom: 6px; color: rgba(255,255,255,0.7); transition: all 0.3s; font-weight: 500; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-item.active { background: var(--bg); color: var(--primary); font-weight: 700; box-shadow: inset 0 2px 6px rgba(0,0,0,0.05); }
        .admin-only { display: none; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar {
            height: 64px; background: var(--surface); padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .content-area { flex: 1; padding: 28px; overflow-y: auto; background: var(--bg); }

        /* ===== DASHBOARD PREMIUM ===== */
        .dashboard-container { display: flex; flex-direction: column; gap: 28px; }
        .dash-banner {
            background: linear-gradient(135deg, #0a4629 0%, #0f6b3d 100%);
            border-radius: var(--radius);
            padding: 36px 32px;
            color: white;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 25px -5px rgba(15,107,61,0.3);
            position: relative; overflow: hidden;
        }
        .dash-banner::after {
            content: '';
            position: absolute;
            right: -30px; bottom: -30px;
            width: 180px; height: 180px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }
        .dash-banner h2 { font-size: 30px; font-weight: 700; margin-bottom: 6px; }
        .dash-banner p { font-size: 16px; opacity: 0.9; font-weight: 500; }
        .date-badge {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 500;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .dash-cards-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 22px;
        }
        .dash-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex; align-items: center; gap: 18px;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            backdrop-filter: blur(6px);
            background: rgba(255,255,255,0.8);
        }
        .dash-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
            background: white;
        }
        .card-icon {
            width: 54px; height: 54px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .card-info .title {
            font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .card-info .value {
            font-size: 28px; font-weight: 700; color: var(--text);
        }
        .card-info .value small { font-size: 15px; font-weight: 500; color: var(--text-secondary); }

        .dash-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .dash-grid-half { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .dash-grid-3col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .dash-panel {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .dash-panel h3 {
            font-size: 18px; font-weight: 700; color: var(--text);
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 8px;
        }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
        .list-item:last-child { border-bottom: none; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        /* Table */
        .table-responsive {
            background: var(--surface); border-radius: var(--radius);
            box-shadow: var(--shadow); overflow: auto;
        }
        table { width: 100%; min-width: 750px; border-collapse: collapse; }
        th {
            background: #f1f5f9; color: var(--text);
            font-weight: 700; font-size: 13px; padding: 14px 16px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        td { padding: 13px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafbfc; }

        /* Dark mode */
        body.dark-mode {
            --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9;
            --text-secondary: #94a3b8; --border: #334155;
        }
        body.dark-mode .topbar, body.dark-mode .dash-card, body.dark-mode .dash-panel,
        body.dark-mode .table-responsive, body.dark-mode .modal-content {
            background: #1e293b; border-color: #334155;
        }
        body.dark-mode th { background: #2d3a50; }
        body.dark-mode td { border-bottom-color: #334155; }
        body.dark-mode .nav-item.active { background: #0f172a; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; top:0; left:0; height:100vh; transform: translateX(-100%); z-index:200; }
            .sidebar.mobile-open { transform: translateX(0); }
            .dash-cards-row { grid-template-columns: repeat(2,1fr); }
            .dash-grid-2, .dash-grid-half, .dash-grid-3col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>

    <!-- Login Screen -->
    <div id="auth-screen">
        <div class="login-box-new">
            <div class="login-header" style="text-align:center; margin-bottom:25px;">
                <i class="fas fa-mosque" style="font-size:44px; color:#0f6b3d; margin-bottom:10px;"></i>
                <h2>SISTEM MANAJEMEN SANTRI</h2>
                <p style="color:#64748b; font-size:14px;">Pembinaan Santri Putra</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group" style="margin-bottom:16px;">
                    <label style="font-weight:600;">Username</label>
                    <div style="position:relative;">
                        <i class="fas fa-user" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94a3b8;"></i>
                        <input type="text" id="username" class="form-control-new" placeholder="Username" required style="padding-left:42px;">
                    </div>
                </div>
                <div class="input-group" style="margin-bottom:20px;">
                    <label style="font-weight:600;">Password</label>
                    <div style="position:relative;">
                        <i class="fas fa-lock" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94a3b8;"></i>
                        <input type="password" id="password" class="form-control-new" placeholder="Password" required style="padding-left:42px;">
                        <i class="fas fa-eye toggle-password" onclick="togglePass()" id="eye-icon" style="position:absolute; right:14px; top:50%; transform:translateY(-50%); cursor:pointer; color:#94a3b8;"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login-new" style="width:100%; padding:14px; background:#0f6b3d; border:none; border-radius:12px; color:white; font-weight:700; font-size:16px;">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-mosque sidebar-logo-icon"></i>
                <h3>SMS<br>Ikhwan</h3>
            </div>
            <div class="nav-menu">
                <div class="nav-item active" onclick="navigate('dashboard', event)"><i class="fas fa-chart-line"></i> <span>Dashboard</span></div>
                <div class="nav-item" onclick="navigate('santri', event)"><i class="fas fa-users"></i> <span>Data Santri</span></div>
                <div class="nav-item" onclick="navigate('pelanggaran', event)"><i class="fas fa-exclamation-triangle"></i> <span>Pelanggaran</span></div>
                <div class="nav-item admin-only" onclick="navigate('master', event)"><i class="fas fa-database"></i> <span>Master Data</span></div>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <div><i class="fas fa-bars" style="cursor:pointer; font-size:22px;" onclick="toggleSidebar()"></i></div>
                <div style="display:flex; align-items:center; gap:20px;">
                    <button class="icon-btn" onclick="toggleDarkMode()"><i class="far fa-moon"></i></button>
                    <div class="user-profile" onclick="confirmLogout()" style="background:#0f6b3d; width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; cursor:pointer;">
                        <span id="user-initial">U</span>
                    </div>
                </div>
            </div>

            <div class="content-area">
                <!-- Dashboard Premium -->
                <div id="view-dashboard" class="view-section" style="display:block;">
                    <div class="dashboard-container">
                        <div class="dash-banner">
                            <div>
                                <h2>Ahlan wa Sahlan, <span id="dash-nama">Admin</span>!</h2>
                                <p>Pantau kondisi santri hari ini.</p>
                            </div>
                            <div class="date-badge" id="live-date"></div>
                        </div>
                        <div class="dash-cards-row" id="status-santri-cards"></div>
                        <div class="dash-cards-row" id="izin-sakit-cards"></div>
                        <div class="dash-grid-2">
                            <div class="dash-panel"><h3>📊 Pelanggaran Bulanan</h3><canvas id="chartPelanggaranBaru"></canvas></div>
                            <div class="dash-panel"><h3>📈 Statistik Poin</h3><div id="stat-cepat-container"></div></div>
                        </div>
                        <div class="dash-grid-3col">
                            <div class="dash-panel"><h3>🛏️ Kamar</h3><canvas id="chartPerKamar" height="140"></canvas></div>
                            <div class="dash-panel"><h3>📚 Kelas</h3><canvas id="chartPerKelas" height="140"></canvas></div>
                            <div class="dash-panel"><h3>🏢 Gedung</h3><canvas id="chartPerGedung" height="140"></canvas></div>
                        </div>
                    </div>
                </div>

                <!-- Generic Table -->
                <div id="view-generic" class="view-section">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                        <h2 id="view-title" style="font-weight:700;">Data</h2>
                        <div style="display:flex; gap:12px;">
                            <input type="text" id="searchInput" class="form-control" placeholder="Cari..." onkeyup="filterTable(true)" style="width:260px;">
                            <button class="btn" onclick="openModal()"><i class="fas fa-plus"></i> Tambah</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table id="data-table">
                            <thead id="data-table-head"></thead>
                            <tbody id="data-table-body"></tbody>
                        </table>
                    </div>
                    <div id="pagination-controls" style="display:flex; justify-content:space-between; margin-top:16px; font-size:14px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="genericModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); justify-content:center; align-items:center; z-index:1000;">
        <div class="modal-content" style="background:white; border-radius:20px; padding:28px; max-width:700px; width:95%;">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3 id="modal-title">Form</h3>
                <button onclick="closeModal()" style="background:none; border:none; font-size:24px;">&times;</button>
            </div>
            <form id="genericForm" onsubmit="submitForm(event)">
                <input type="hidden" id="form-id">
                <div class="form-grid" id="form-fields" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;"></div>
                <div style="text-align:right; margin-top:24px;">
                    <button type="button" class="btn btn-danger" onclick="closeModal()" style="margin-right:8px;">Batal</button>
                    <button type="submit" class="btn">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwKpESn1lZBzTyppEHJMg51ZldWYqNOZ51P7tKxBuLM67fsuXiF6rHQTaJZnm3zBU5F/exec";
        let currentUser, currentModule, moduleData=[], schemaDef={}, listNamaSantri=[], currentPage=1;
        const rowsPerPage=20;

        // Schema
        const schemas = {
            santri: {
                title:"Data Santri", table:"Santri",
                fields:[
                    {name:'id', type:'hidden'},
                    {name:'nis', label:'NIS', type:'text', req:true},
                    {name:'nama', label:'Nama Lengkap', type:'text', req:true, full:true},
                    {name:'kelas', label:'Kelas', type:'select', options:['7','8','9','10','11','12']},
                    {name:'asrama', label:'Asrama', type:'text'},
                    {name:'kamar', label:'Kamar', type:'text'},
                    {name:'pembina', label:'Pembina', type:'text'},
                    {name:'namakelas', label:'Nama Kelas', type:'text'},
                    {name:'status', label:'Status', type:'select', options:['Aktif','Nonaktif','Lulus','Pindah','Keluar']}
                ],
                tableHeaders:['NIS','Nama','Kelas','Asrama','Kamar','Pembina','Nama Kelas','Status'],
                cols:['nis','nama','kelas','asrama','kamar','pembina','namakelas','status']
            },
            pelanggaran:{
                title:"Pelanggaran", table:"Pelanggaran",
                fields:[
                    {name:'id', type:'hidden'},{name:'tanggal', label:'Tanggal', type:'date', req:true},
                    {name:'nama_santri', label:'Nama Santri', type:'autocomplete', req:true},
                    {name:'pelanggaran', label:'Pelanggaran', type:'text', req:true, full:true},
                    {name:'poin', label:'Poin', type:'number', req:true},
                    {name:'tindakan', label:'Tindak Lanjut', type:'text'}
                ],
                cols:['tanggal','nama_santri','pelanggaran','poin','tindakan']
            }
        };

        // Helper
        function getRowValue(row, key){
            if(row[key] !== undefined) return row[key];
            const lk = key.toLowerCase();
            for(let k in row){ if(k.toLowerCase()===lk) return row[k]; }
            return '-';
        }

        async function apiCall(data){
            const res = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(data)});
            if(!res.ok) throw new Error("Jaringan bermasalah");
            return res.json();
        }

        window.onload = () => {
            const u = localStorage.getItem('sim_user');
            if(u){ currentUser=JSON.parse(u); setupApp(); }
        };

        function handleLogin(e){
            e.preventDefault();
            document.getElementById('loader').style.display='flex';
            apiCall({action:'login', username:document.getElementById('username').value, password:document.getElementById('password').value})
            .then(r=>{
                document.getElementById('loader').style.display='none';
                if(r.success){ currentUser=r.user; localStorage.setItem('sim_user',JSON.stringify(currentUser)); setupApp(); Swal.fire('Login Berhasil','','success'); }
                else Swal.fire('Gagal', r.message, 'error');
            });
        }

        function setupApp(){
            document.getElementById('auth-screen').style.display='none';
            document.getElementById('app-screen').style.display='flex';
            document.getElementById('user-initial').innerText=currentUser.nama.charAt(0).toUpperCase();
            if(currentUser.role==='Super Admin') document.querySelectorAll('.admin-only').forEach(e=>e.style.display='flex');
            apiCall({action:'getTableData', sheetName:'Santri'}).then(r=>{ if(r.success) listNamaSantri=r.data.map(s=>s.nama); });
            navigate('dashboard');
            updateDate();
        }

        function updateDate(){
            const d = new Date();
            document.getElementById('live-date').innerText = d.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
        }

        function navigate(view, evt){
            document.querySelectorAll('.view-section').forEach(e=>e.style.display='none');
            document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
            if(evt?.currentTarget) evt.currentTarget.classList.add('active');
            if(view==='dashboard'){ document.getElementById('view-dashboard').style.display='block'; loadDashboard(); }
            else if(schemas[view]){ currentModule=view; schemaDef=schemas[view]; document.getElementById('view-generic').style.display='block'; document.getElementById('view-title').innerText=schemaDef.title; loadTableData(); }
        }

        function loadDashboard(){
            document.getElementById('loader').style.display='flex';
            apiCall({action:'getDashboardStats'}).then(r=>{
                document.getElementById('loader').style.display='none';
                if(r.success) renderDashboard(r.data);
                else renderDashboard({totAktif:0,totNonaktif:0,totLulus:0,totPindah:0,totKeluar:0,totIzin:0,totSakit:0,chartPelLabels:[],chartPelData:[],persenAman:0,persenPerhatian:0,persenPembinaan:0,santriPerKamar:[],santriPerKelas:[],santriPerGedung:[],pelanggaranTerbaru:[],izinSakitTerbaru:[]});
            });
        }

        function renderDashboard(d){
            const cards = [
                {t:'Aktif',v:d.totAktif,icon:'fa-user-check',col:'#0f6b3d'},
                {t:'Nonaktif',v:d.totNonaktif,icon:'fa-user-times',col:'#e53935'},
                {t:'Lulus',v:d.totLulus,icon:'fa-graduation-cap',col:'#1e88e5'},
                {t:'Pindah',v:d.totPindah,icon:'fa-exchange-alt',col:'#ffb300'},
                {t:'Keluar',v:d.totKeluar,icon:'fa-door-open',col:'#8e24aa'}
            ];
            document.getElementById('status-santri-cards').innerHTML = cards.map(c=>`
                <div class="dash-card">
                    <div class="card-icon" style="background:${c.col}"><i class="fas ${c.icon}"></i></div>
                    <div class="card-info"><div class="title">${c.t}</div><div class="value">${c.v} <small>santri</small></div></div>
                </div>`).join('');
            document.getElementById('izin-sakit-cards').innerHTML = `
                <div class="dash-card"><div class="card-icon" style="background:#ff9800"><i class="fas fa-calendar-alt"></i></div><div class="card-info"><div class="title">Izin</div><div class="value">${d.totIzin} <small>santri</small></div></div></div>
                <div class="dash-card"><div class="card-icon" style="background:#f44336"><i class="fas fa-heartbeat"></i></div><div class="card-info"><div class="title">Sakit</div><div class="value">${d.totSakit} <small>santri</small></div></div></div>
            `;
            // charts
            if(window.c1) window.c1.destroy();
            window.c1 = new Chart(document.getElementById('chartPelanggaranBaru').getContext('2d'), {
                type:'bar', data:{labels:d.chartPelLabels, datasets:[{data:d.chartPelData, backgroundColor:'#0f6b3d', borderRadius:6}]}
            });
            document.getElementById('stat-cepat-container').innerHTML = `
                <div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;"><span>Aman (0-19)</span><b>${d.persenAman}%</b></div><div style="background:#e2e8f0;height:6px;border-radius:3px;margin-top:4px"><div style="width:${d.persenAman}%;height:100%;background:#0f6b3d;border-radius:3px"></div></div></div>
                <div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;"><span>Perhatian (20-49)</span><b>${d.persenPerhatian}%</b></div><div style="background:#e2e8f0;height:6px;"><div style="width:${d.persenPerhatian}%;background:#ffb300;height:100%"></div></div></div>
                <div><div style="display:flex;justify-content:space-between;"><span>Pembinaan (>50)</span><b>${d.persenPembinaan}%</b></div><div style="background:#e2e8f0;height:6px;"><div style="width:${d.persenPembinaan}%;background:#e53935;height:100%"></div></div></div>
            `;
            // kamar, kelas, gedung charts
            if(window.c2) window.c2.destroy();
            window.c2 = new Chart(document.getElementById('chartPerKamar').getContext('2d'), {type:'bar', data:{labels:(d.santriPerKamar||[]).map(i=>i.kamar), datasets:[{data:(d.santriPerKamar||[]).map(i=>i.jumlah), backgroundColor:'#0f6b3d'}]}});
            if(window.c3) window.c3.destroy();
            window.c3 = new Chart(document.getElementById('chartPerKelas').getContext('2d'), {type:'bar', data:{labels:(d.santriPerKelas||[]).map(i=>'Kls '+i.kelas), datasets:[{data:(d.santriPerKelas||[]).map(i=>i.jumlah), backgroundColor:'#1e88e5'}]}});
            if(window.c4) window.c4.destroy();
            window.c4 = new Chart(document.getElementById('chartPerGedung').getContext('2d'), {type:'bar', data:{labels:(d.santriPerGedung||[]).map(i=>i.gedung), datasets:[{data:(d.santriPerGedung||[]).map(i=>i.jumlah), backgroundColor:'#ffb300'}]}});
        }

        function loadTableData(){
            document.getElementById('loader').style.display='flex';
            apiCall({action:'getTableData', sheetName:schemaDef.table}).then(r=>{
                document.getElementById('loader').style.display='none';
                if(r.success){ moduleData=r.data; renderTable(); }
            });
        }

        function renderTable(){
            const head = document.getElementById('data-table-head');
            const body = document.getElementById('data-table-body');
            head.innerHTML = '<tr><th>NO</th>' + schemaDef.tableHeaders.map(h=>`<th>${h}</th>`).join('') + '<th>AKSI</th></tr>';
            const paginated = moduleData.slice((currentPage-1)*rowsPerPage, currentPage*rowsPerPage);
            body.innerHTML = paginated.map((row,i)=>`<tr>
                <td>${(currentPage-1)*rowsPerPage+i+1}</td>
                ${schemaDef.cols.map(c=>`<td style="text-transform:${c==='status'?'capitalize':'none'}">${getRowValue(row,c)}</td>`).join('')}
                <td><button class="btn btn-warning" onclick="editData('${row.id}')"><i class="fas fa-edit"></i></button>
                <button class="btn btn-danger" onclick="deleteData('${row.id}')"><i class="fas fa-trash"></i></button></td>
            </tr>`).join('') || '<tr><td colspan="10" style="text-align:center;padding:20px;">Tidak ada data</td></tr>';
        }

        function editData(id){ openModal(id); }
        function deleteData(id){
            Swal.fire({title:'Hapus?', icon:'warning', showCancelButton:true}).then(r=>{
                if(r.isConfirmed){
                    apiCall({action:'deleteRecord', sheetName:schemaDef.table, id}).then(()=> loadTableData());
                }
            });
        }
        function openModal(id=null){
            document.getElementById('genericModal').style.display='flex';
            let row = id ? moduleData.find(r=>r.id==id) : {};
            document.getElementById('form-fields').innerHTML = schemaDef.fields.map(f=>{
                let val = row[f.name]||'';
                if(f.type==='hidden') return `<input type="hidden" id="f_${f.name}" value="${val}">`;
                let html = `<div class="form-group ${f.full?'full-width':''}"><label>${f.label}</label>`;
                if(f.type==='select') html+=`<select id="f_${f.name}" class="form-control">${f.options.map(o=>`<option value="${o}" ${val==o?'selected':''}>${o}</option>`).join('')}</select>`;
                else if(f.type==='autocomplete') html+=`<input type="text" id="f_${f.name}" list="list_${f.name}" class="form-control" value="${val}" autocomplete="off"><datalist id="list_${f.name}">${listNamaSantri.map(n=>`<option value="${n}">`).join('')}</datalist>`;
                else html+=`<input type="${f.type}" id="f_${f.name}" class="form-control" value="${val}">`;
                return html+`</div>`;
            }).join('');
        }
        function closeModal(){ document.getElementById('genericModal').style.display='none'; }
        function submitForm(e){
            e.preventDefault();
            let data = {};
            schemaDef.fields.forEach(f=> data[f.name] = document.getElementById(`f_${f.name}`)?.value );
            apiCall({action:'saveRecord', sheetName:schemaDef.table, data, username:currentUser.username}).then(()=>{ closeModal(); loadTableData(); });
        }
        function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed'); }
        function toggleDarkMode(){ document.body.classList.toggle('dark-mode'); }
        function confirmLogout(){ Swal.fire({title:'Logout?', icon:'question', showCancelButton:true}).then(r=>{ if(r.isConfirmed) { localStorage.removeItem('sim_user'); window.location.reload(); } }); }
        function togglePass(){ let p=document.getElementById('password'); p.type = p.type==='password'?'text':'password'; }
    </script>
</body>
</html>
