<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SISTEM MANAJEMEN SANTRI (SMS)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #489744;
            --primary-hover: #3A8237;
            --primary-dark: #244423;
            --primary-light: #E4F5E3;
            --bg: #F4FAF3;
            --text-dark: #1f2937;
            --sidebar-width: 250px;
            /* safe area untuk iPhone */
            --safe-inset-top: env(safe-area-inset-top, 0px);
            --safe-inset-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: var(--bg); 
            color: var(--text-dark); 
            overflow-x: hidden; 
            /* dynamic viewport height supaya di iPhone address bar gak ganggu */
            height: 100vh; 
            height: 100dvh;
        }

        /* --- LOGIN SCREEN --- */
        #auth-screen { 
            height: 100vh; 
            height: 100dvh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: radial-gradient(circle at 15% 25%, #2A5328 0%, transparent 40%),
                        radial-gradient(circle at 85% 85%, #489744 0%, transparent 40%),
                        #0E250E; 
        }
        .login-box-new { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            width: 90%; 
            max-width: 420px; 
            margin: 20px; /* biar gak nempel di tepi HP */
        }

        /* --- APP LAYOUT --- */
        #app-screen { 
            display: none; 
            height: 100vh; 
            height: 100dvh; 
            overflow: hidden; 
            position: relative; /* untuk positioning sidebar mobile */
        }
        
        /* ===== SIDEBAR ===== */
        .sidebar { 
            width: var(--sidebar-width); 
            background: var(--primary-dark); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), transform 0.3s ease; 
            z-index: 100;
            flex-shrink: 0;
        }
        .sidebar.collapsed { width: 85px; }
        .sidebar-header { 
            height: 80px; 
            display: flex; 
            align-items: center; 
            padding-left: 25px; 
            white-space: nowrap; 
            overflow: hidden;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar-logo-icon { font-size: 24px; color: var(--primary-light); min-width: 40px; }
        .sidebar-header h3 { font-size: 15px; line-height: 1.3; transition: opacity 0.3s; }
        .sidebar.collapsed .sidebar-header h3 { opacity: 0; pointer-events: none; }
        .nav-menu { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px 0 20px 15px; }
        .nav-item { 
            padding: 15px 20px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            transition: 0.3s; 
            position: relative; 
            border-radius: 30px 0 0 30px; 
            margin-bottom: 8px; 
            color: #a7cfa5; 
            white-space: nowrap;
        }
        .nav-item i { font-size: 20px; min-width: 35px; text-align: left; z-index: 2; transition: 0.3s; }
        .nav-item span { font-size: 14px; font-weight: 500; transition: opacity 0.3s; z-index: 2; }
        .sidebar.collapsed .nav-item span { opacity: 0; pointer-events: none; }
        .nav-item:hover { color: white; }
        .nav-item.active { 
            background: var(--bg); 
            color: var(--primary); 
            font-weight: bold;
        }
        .nav-item.active::before,
        .nav-item.active::after {
            content: '';
            position: absolute;
            right: 0;
            width: 25px;
            height: 25px;
            background: transparent;
            z-index: 1;
        }
        .nav-item.active::before {
            top: -25px;
            border-bottom-right-radius: 25px;
            box-shadow: 10px 10px 0 10px var(--bg);
        }
        .nav-item.active::after {
            bottom: -25px;
            border-top-right-radius: 25px;
            box-shadow: 10px -10px 0 10px var(--bg);
        }
        /* menu admin */
        .admin-only { display: none; }

        /* ===== MAIN CONTENT ===== */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            min-width: 0; /* penting untuk flex child */
        }
        .topbar { 
            height: 60px; 
            background: white; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 20px; 
            flex-shrink: 0;
        }
        .content-area { flex: 1; padding: 20px; overflow-y: auto; }
        
        /* --- DASHBOARD RESPONSIVE --- */
        .dashboard-container { display: flex; flex-direction: column; gap: 20px; }
        .dash-cards-row { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
        }
        .dash-grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .dash-grid-half { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .dash-card, .dash-panel { /* ... */ }
        /* (style dashboard lainnya tetap) */

        /* --- TABEL & PAGINATION --- */
        .table-responsive { width: 100%; overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        table { width: 100%; min-width: 600px; border-collapse: collapse; } /* min-width agar scroll */
        th, td { padding: 12px 15px; text-align: left; font-size: 14px; }
        th { background: #459a4c; color: white; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        td { border-bottom: 1px solid #eee; }
        tr:hover td { background-color: #f9fafb; }

        /* --- MODAL RESPONSIVE --- */
        .modal-content { 
            width: 95%; 
            max-width: 750px; 
            margin: 20px;
        }
        .form-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        /* --- TOPBAR --- */
        .topbar-right { display: flex; align-items: center; gap: 15px; }
        .icon-btn { background: transparent; border: none; font-size: 20px; color: var(--text-dark); cursor: pointer; /* ... */ }

        /* --- DARK MODE --- */
        /* ... tetap seperti sebelumnya ... */

        /* ===================================================================
           MEDIA QUERIES UNTUK RESPONSIVE (Mobile, Tablet, iPhone)
           =================================================================== */
        
        /* Tablet kecil / HP landscape (max 768px) */
        @media (max-width: 768px) {
            /* Ubah layout app: sidebar jadi overlay fixed */
            #app-screen {
                flex-direction: column;
            }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                height: 100dvh;
                transform: translateX(-100%);
                box-shadow: 2px 0 15px rgba(0,0,0,0.3);
                z-index: 200;
                /* padding-top: var(--safe-inset-top); */ /* jika perlu */
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            .sidebar.collapsed {
                width: 85px; /* di mobile tetap bisa collapse kalau diaktifkan */
            }
            /* overlay background saat sidebar terbuka */
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.4);
                z-index: 150;
            }
            .sidebar-overlay.active {
                display: block;
            }
            /* Main content selalu full width */
            .main-content {
                width: 100%;
            }
            /* Tombol hamburger lebih besar */
            .topbar .fa-bars {
                font-size: 22px;
                padding: 10px;
            }

            /* Dashboard cards: 2 kolom */
            .dash-cards-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .dash-grid-2 {
                grid-template-columns: 1fr;
            }
            .dash-grid-half {
                grid-template-columns: 1fr;
            }
            .dash-banner {
                padding: 25px 20px;
                flex-direction: column;
                align-items: flex-start;
            }
            .dash-banner h2 { font-size: 20px; }
            
            /* Tabel: font lebih kecil */
            th, td { padding: 8px 10px; font-size: 12px; }
            
            /* Form modal: 1 kolom */
            .form-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                padding: 20px;
            }
            
            /* Header action: tumpuk di mobile */
            .header-action {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-action > div:last-child {
                flex-direction: column;
                max-width: 100%;
            }
            .header-action input {
                width: 100%;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }

            /* pagination lebih simpel */
            #pagination-controls {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
        }

        /* HP kecil (max 480px) */
        @media (max-width: 480px) {
            .dash-cards-row {
                grid-template-columns: 1fr; /* 1 card per baris */
            }
            .login-box-new {
                padding: 25px;
            }
            .topbar-right {
                gap: 8px;
            }
            .user-profile {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
            .icon-btn {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
            /* modal lebih sempit */
            .modal-content {
                width: 100%;
                border-radius: 0;
                margin: 0;
                max-height: 100vh;
                max-height: 100dvh;
            }
        }

        /* Tablet besar / landscape (antara 769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .dash-cards-row {
                grid-template-columns: repeat(3, 1fr);
            }
            .dash-grid-2 {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Untuk iPhone dengan notch (safe area) */
        @supports (padding: env(safe-area-inset-bottom)) {
            .content-area {
                padding-bottom: calc(20px + var(--safe-inset-bottom));
            }
            .topbar {
                padding-top: var(--safe-inset-top);
            }
        }
    </style>
</head>
<body>

    <!-- Overlay untuk mobile sidebar -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <div id="loader"><div class="spinner"></div></div>

    <!-- Login Screen -->
    <div id="auth-screen">
        <!-- ... sama seperti sebelumnya ... -->
    </div>

    <!-- Main App -->
    <div id="app-screen">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- ... header dan nav-menu sama ... -->
        </div>

        <div class="main-content">
            <div class="topbar">
                <div><i class="fas fa-bars" style="cursor:pointer; font-size: 18px;" onclick="toggleSidebar()" id="sidebar-toggle"></i></div>
                <!-- topbar right sama -->
            </div>
            
            <div class="content-area" id="content-area">
                <!-- dashboard dan view lainnya -->
            </div>
        </div>
    </div>

    <!-- Modal sama -->
    <script>
        // ... semua script sebelumnya ...

        // ===== FUNGSI TOGGLE SIDEBAR (RESPONSIVE) =====
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            // Deteksi jika lebar layar <= 768 (mobile), gunakan overlay mode
            if (window.innerWidth <= 768) {
                sidebar.classList.toggle('mobile-open');
                overlay.classList.toggle('active');
                // Pastikan class collapsed tidak bentrok (di mobile kita pakai mobile-open)
                sidebar.classList.remove('collapsed');
            } else {
                // Desktop: collapse/expand seperti sebelumnya
                sidebar.classList.toggle('collapsed');
            }
        }

        function closeMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('active');
        }

        // Tutup sidebar mobile jika layar di-resize ke atas 768px
        window.addEventListener('resize', function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (window.innerWidth > 768) {
                sidebar.classList.remove('mobile-open');
                overlay.classList.remove('active');
                // Kembalikan ke collapsed/expand sesuai preferensi (biarkan saja default tidak collapsed)
            }
        });

        // Saat navigasi dari sidebar mobile, tutup sidebar otomatis
        const originalNavigate = navigate;
        navigate = function(view, evt) {
            originalNavigate(view, evt);
            if (window.innerWidth <= 768) {
                closeMobileSidebar();
            }
        };

        // ... sisa script tetap ...
    </script>
</body>
</html>
